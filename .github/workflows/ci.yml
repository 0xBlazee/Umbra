name: Charon Build Verification Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-compilation-test:
    runs-on: ubuntu-latest
    steps:
    - name: Clone current branch assets
      uses: actions/checkout@v4

    - name: Set up compilation dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential mingw-w64 python3

    - name: Run Python script syntax check
      run: python3 -m py_compile server.py

    - name: Run automated cross-compilation check via Makefile
      run: make
